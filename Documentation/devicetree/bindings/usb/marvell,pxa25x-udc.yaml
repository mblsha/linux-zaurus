%YAML 1.2
---
$id: http://devicetree.org/schemas/usb/marvell,pxa25x-udc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell PXA25x USB device controller

maintainers:
  - Robert Jarzmik <robert.jarzmik@free.fr>

properties:
  compatible:
    const: marvell,pxa25x-udc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  pullup-gpios:
    description: GPIO controlling the USB D+ pull-up
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/pxa-clock.h>
    #include <dt-bindings/gpio/gpio.h>

    usb@40600000 {
        compatible = "marvell,pxa25x-udc";
        reg = <0x40600000 0x10000>;
        interrupts = <11>;
        clocks = <&clks CLK_UDC>;
        pullup-gpios = <&gpio 45 GPIO_ACTIVE_HIGH>;
    };
