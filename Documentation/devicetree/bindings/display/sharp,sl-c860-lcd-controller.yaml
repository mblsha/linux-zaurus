%YAML 1.2
---
$id: http://devicetree.org/schemas/display/sharp,sl-c860-lcd-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sharp SL-C860 LCD timing and backlight controller

maintainers:
  - Zaurus Linux maintainers <zaurus-lab@localhost>

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: sharp,sl-c860-lcd-controller

  reg:
    maxItems: 1

  backlight-control-gpios:
    maxItems: 1

  sharp,common-voltage-adjust:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 255
    description:
      Raw 8-bit common-voltage DAC adjustment. This provides a deterministic
      fallback when the bootloader does not preserve the Sharp factory
      parameter block in RAM.

  sharp,phase-adjust:
    $ref: /schemas/types.yaml#/definitions/uint32
    maximum: 15
    description:
      Four-bit LCD input sampling phase adjustment. This provides a
      deterministic fallback when the bootloader does not preserve the Sharp
      factory parameter block in RAM.

  spi-max-frequency:
    maximum: 50000

required:
  - compatible
  - reg
  - backlight-control-gpios

  - spi-max-frequency

unevaluatedProperties: false
