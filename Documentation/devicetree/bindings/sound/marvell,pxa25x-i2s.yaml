%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/marvell,pxa25x-i2s.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Marvell PXA25x I2S controller

maintainers:
  - Michael Pishchagin <mblsha+gh@gmail.com>

properties:
  compatible:
    const: marvell,pxa25x-i2s

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names:
    items:
      - const: i2s

  dmas:
    items:
      - description: receive DMA channel
      - description: transmit DMA channel

  dma-names:
    items:
      - const: rx
      - const: tx

  '#sound-dai-cells':
    const: 0

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - '#sound-dai-cells'

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/pxa-clock.h>
    audio-controller@40400000 {
        compatible = "marvell,pxa25x-i2s";
        reg = <0x40400000 0x84>;
        interrupts = <13>;
        clocks = <&clks CLK_I2S>;
        clock-names = "i2s";
        #sound-dai-cells = <0>;
    };
