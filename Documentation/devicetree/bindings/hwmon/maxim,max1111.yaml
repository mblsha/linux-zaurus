%YAML 1.2
---
$id: http://devicetree.org/schemas/hwmon/maxim,max1111.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Maxim MAX1110/MAX1111/MAX1112/MAX1113 ADC

maintainers:
  - Zaurus Linux maintainers <zaurus-lab@localhost>

allOf:
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    enum:
      - maxim,max1110
      - maxim,max1111
      - maxim,max1112
      - maxim,max1113

  reg:
    maxItems: 1

  spi-max-frequency: true

required:
  - compatible
  - reg

  - spi-max-frequency

unevaluatedProperties: false
