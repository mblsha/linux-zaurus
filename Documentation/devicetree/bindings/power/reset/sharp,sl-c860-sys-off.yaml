%YAML 1.2
---
$id: http://devicetree.org/schemas/power/reset/sharp,sl-c860-sys-off.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Sharp SL-C860 bootloader system-off selection

maintainers:
  - Zaurus Lab <zaurus-lab@localhost>

description: |
  The SL-C860 bootloader samples the green mail LED output after a watchdog
  reset. A low output requests halt and a high output requests another boot.
  The referenced LED remains a normal LED class device during runtime.

properties:
  compatible:
    const: sharp,sl-c860-sys-off

  leds:
    maxItems: 1
    description: Green mail LED sampled by the bootloader.

required:
  - compatible
  - leds

additionalProperties: false

examples:
  - |
    system-off {
        compatible = "sharp,sl-c860-sys-off";
        leds = <&mail_led>;
    };
...
